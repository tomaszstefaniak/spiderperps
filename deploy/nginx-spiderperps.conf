# /etc/nginx/sites-available/spiderperps - replace SERVER_NAME; certbot adds the TLS block.
server {
    listen 80;
    server_name SERVER_NAME;

    # Copy-trading API used by the mobile app
    location /v1/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web app: landing, trader pages, /link phone approval, /trade
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
